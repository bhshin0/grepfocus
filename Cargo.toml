[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/daemon",
    "crates/gui",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
# Source-available, not OSI open source: PolyForm Shield permits any use
# EXCEPT building something that competes with GrepFocus. See LICENSE.
license = "LicenseRef-PolyForm-Shield-1.0.0"
repository = "https://github.com/bhshin0/grepfocus"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
