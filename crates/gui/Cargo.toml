[package]
name = "grepfocus-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GrepFocus desktop GUI"

[[bin]]
name = "grepfocus-gui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
grepfocus-core = { path = "../core" }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "io-util"] }
tauri = { version = "2", features = ["devtools", "tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-localhost = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
portpicker = "0.1"
# Already compiled into the GUI via tauri-utils; this adds a lock edge, not a crate.
semver = "1"
